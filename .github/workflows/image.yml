name: Test and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Test and vet
        working-directory: services/api
        run: go test -race -count=1 ./... && go vet ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SITE_URL: ${{ vars.KUKIE_SITE_URL || 'https://www.kukie.cn' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$COMMIT"
            if [ "$REF_TYPE" = branch ] && [ "$REF_NAME" = main ]; then echo "$image:latest"; fi
            if [ "$REF_TYPE" = tag ]; then echo "$image:$REF_NAME"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build native smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: kukie-smoke:ci
          build-args: KUKIE_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify packaged runtime
        run: bash scripts/smoke-image.sh kukie-smoke:ci
      - name: Sign in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.names.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: KUKIE_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Published digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '### Image\n`%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
